[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "metrion"
version = "0.1.0"
description = "Traces for LLM applications"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
# No required dependencies. The transport is urllib, so a customer using only
# the manual API inherits nothing — and an SDK that pulls in httpx to send a
# few JSON bodies is a dependency conflict waiting to happen in somebody
# else's application.
dependencies = []

[project.optional-dependencies]
# The drop-in wrapper needs the official SDK; the manual API does not, so a
# caller who never touches OpenAI does not inherit it.
openai = ["openai>=1.0"]

[tool.hatch.build.targets.wheel]
packages = ["metrion"]
